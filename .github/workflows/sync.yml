name: sync

# 원장 시트 → products/*.txt 재생성. 수동 실행 전용 (시트 수정 직후 버튼 실행).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save googleapis
      - name: generate product files from ledger
        run: node scripts/sync.js
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      - run: node scripts/lint.js
      - name: commit and push if changed
        run: |
          git config user.name "license-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add products
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync whitelist from ledger"
            git push
          fi
